<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 788 398" width="788" height="398" role="img" aria-label="EngineConfig&lt;Model, Gpu&gt; has eight members; four are types checked by a concept, n_ctx is MK_N_CTX capped by the model's context length, threads derive from the model, the reference block size and the barrier's spin limit are values, and the grid derives from the GPU type's SM count and blocks per SM.">
  <title>EngineConfig&lt;Model, Gpu&gt; has eight members; four are types checked by a concept, n_ctx is MK_N_CTX capped by the model's context length, threads derive from the model, the reference block size and the barrier's spin limit are values, and the grid derives from the GPU type's SM count and blocks per SM.</title>
  <style>
    svg { color: #1a222e; }
    text { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #1a222e; }
    .small { font-size: 10.5px; }
    .dim { fill: #5a6574; }
    .box { fill: #f6f7f9; stroke: #1a222e; stroke-width: 1.2; }
    .ctbox { fill: #dff3ef; stroke: #0b7267; stroke-width: 1.4; }
    .rtbox { fill: #fbe6d9; stroke: #b8480f; stroke-width: 1.4; }
    .wire { stroke: #1a222e; stroke-width: 1.3; fill: none; }
    .dash { stroke: #5a6574; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .ctfill { fill: #0b7267; } .rtfill { fill: #b8480f; } .mutefill { fill: #d3d9e1; }
    .cttext { fill: #0b7267; } .rttext { fill: #b8480f; }
    .bar { stroke: #1a222e; stroke-width: 3; }
    .card { fill: #ffffff; stroke: #d3d9e1; stroke-width: 1; }
  </style>
  <rect class="card" x="-13.5" y="-13.5" width="787" height="397" rx="8"/>
    <defs><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1a222e"/></marker></defs>
    <rect class="ctbox" x="10" y="10" width="300" height="310" rx="6"/>
    <text x="24" y="32" font-weight="500">EngineConfig&lt;Model, Gpu&gt;</text>
    <text x="24" y="60">Model     = BuildModel</text>
    <text class="dim" x="24" y="84">  (MK_MODEL: Qwen3, from the GGUF)</text>
    <text x="24" y="108">Kv        = KvBF16</text>
    <text x="24" y="132">n_ctx     = min(MK_N_CTX, context_length)</text>
    <text x="24" y="156">Gpu       = BuildGpu</text>
    <text class="dim" x="24" y="180">  (MK_GPU, default: the GPU found)</text>
    <text x="24" y="204">threads   = group * head_dim</text>
    <text class="dim" x="24" y="228">  (2 * 128 = 256 for Qwen3-0.6B)</text>
    <text x="24" y="252">RowKernel = RowDot8</text>
    <text x="24" y="276">reference_threads  = 256</text>
    <text x="24" y="300">barrier_spin_limit = 1 &lt;&lt; 27</text>
    <line class="wire" x1="310" y1="56" x2="448" y2="56" marker-end="url(#m3)"/><text class="small" x="379" y="48" text-anchor="middle">must satisfy</text>
    <rect class="box" x="450" y="38" width="300" height="36" rx="6"/><text x="462" y="61">ModelSpec: shape, heads, tensors</text>
    <line class="wire" x1="310" y1="104" x2="448" y2="104" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="86" width="300" height="36" rx="6"/><text x="462" y="109">KvFormat: Bits, store, load</text>
    <line class="wire" x1="310" y1="152" x2="448" y2="152" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="134" width="300" height="36" rx="6"/><text x="462" y="157">GpuSpec: sms, cuda_arch, memory</text>
    <line class="wire" x1="310" y1="248" x2="448" y2="248" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="230" width="300" height="36" rx="6"/><text x="462" y="253">RowKernel: step, dot&lt;Cols&gt;</text>
    <path class="wire" d="M160 320 V346 H238" marker-end="url(#m3)"/><text class="small" x="168" y="340">derives</text>
    <text x="246" y="350">Grid: 66 SMs x 2 per SM = 132 blocks, 1,056 warps</text>
  </svg>
