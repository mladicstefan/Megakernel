<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 788 358" width="788" height="358" role="img" aria-label="One launch runs embed, 28 layers and the logits; a layer is six phases that pass buffers to each other, with a barrier after each.">
  <title>One launch runs embed, 28 layers and the logits; a layer is six phases that pass buffers to each other, with a barrier after each.</title>
  <style>
    svg { color: #e5e9ef; }
    text { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e5e9ef; }
    .small { font-size: 10.5px; }
    .dim { fill: #99a4b3; }
    .box { fill: #11151b; stroke: #e5e9ef; stroke-width: 1.2; }
    .ctbox { fill: #12332f; stroke: #35cdb9; stroke-width: 1.4; }
    .rtbox { fill: #3a2415; stroke: #f79456; stroke-width: 1.4; }
    .wire { stroke: #e5e9ef; stroke-width: 1.3; fill: none; }
    .dash { stroke: #99a4b3; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .ctfill { fill: #35cdb9; } .rtfill { fill: #f79456; } .mutefill { fill: #313a48; }
    .cttext { fill: #35cdb9; } .rttext { fill: #f79456; }
    .bar { stroke: #e5e9ef; stroke-width: 3; }
    .card { fill: #1a2029; stroke: #313a48; stroke-width: 1; }
  </style>
  <rect class="card" x="-13.5" y="-13.5" width="787" height="357" rx="8"/>
    <defs><marker id="m4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5e9ef"/></marker></defs>
    <text class="small dim" x="10" y="16">one kernel launch</text>
    <rect class="box" x="10" y="24" width="70" height="34" rx="5"/><text x="45" y="45" text-anchor="middle">embed</text>
    <rect class="box" x="96" y="24" width="84" height="34" rx="5"/><text x="138" y="45" text-anchor="middle">layer 0</text>
    <rect class="box" x="196" y="24" width="84" height="34" rx="5"/><text x="238" y="45" text-anchor="middle">layer 1</text>
    <text x="318" y="45" text-anchor="middle">...</text>
    <rect class="box" x="356" y="24" width="84" height="34" rx="5"/><text x="398" y="45" text-anchor="middle">layer 27</text>
    <rect class="box" x="456" y="24" width="150" height="34" rx="5"/><text x="531" y="45" text-anchor="middle">logits + argmax</text>
    <line class="wire" x1="606" y1="41" x2="668" y2="41" marker-end="url(#m4)"/><text class="rttext" x="676" y="45">next token</text>
    <line class="bar" x1="88" y1="20" x2="88" y2="62"/><line class="bar" x1="188" y1="20" x2="188" y2="62"/><line class="bar" x1="288" y1="20" x2="288" y2="62"/><line class="bar" x1="348" y1="20" x2="348" y2="62"/><line class="bar" x1="448" y1="20" x2="448" y2="62"/>
    <path class="dash" d="M96 58 L20 110"/><path class="dash" d="M180 58 L740 110"/>
    <text class="small dim" x="20" y="126">one layer: six phases</text>
    <text class="small" x="28" y="166" text-anchor="middle">x</text><line class="wire" x1="36" y1="162" x2="68" y2="162" marker-end="url(#m4)"/>
    <rect class="box" x="70" y="140" width="120" height="44" rx="6"/><text x="130" y="159" text-anchor="middle">Qkv</text><text class="small dim" x="130" y="175" text-anchor="middle">norm fused</text>
    <line class="wire" x1="190" y1="162" x2="308" y2="162" marker-end="url(#m4)"/><text class="small" x="249" y="154" text-anchor="middle">Q, K, V</text><line class="bar" x1="200" y1="150" x2="200" y2="174"/>
    <rect class="box" x="310" y="140" width="120" height="44" rx="6"/><text x="370" y="159" text-anchor="middle">AttentionPart</text><text class="small dim" x="370" y="175" text-anchor="middle">every block</text>
    <line class="wire" x1="430" y1="162" x2="548" y2="162" marker-end="url(#m4)"/><text class="small" x="489" y="154" text-anchor="middle">partials</text><line class="bar" x1="440" y1="150" x2="440" y2="174"/>
    <rect class="box" x="550" y="140" width="120" height="44" rx="6"/><text x="610" y="159" text-anchor="middle">AttentionMerge</text><text class="small dim" x="610" y="175" text-anchor="middle">one per KV head</text>
    <path class="wire" d="M670 162 H720 V216 H40 V258 H68" marker-end="url(#m4)"/><text class="small" x="380" y="210" text-anchor="middle">kqv_out</text><line class="bar" x1="680" y1="150" x2="680" y2="174"/>
    <path class="dash" d="M28 172 V250" marker-end="url(#m4)"/><text class="small dim" x="6" y="238">x</text>
    <rect class="box" x="70" y="236" width="120" height="44" rx="6"/><text x="130" y="255" text-anchor="middle">Output</text><text class="small dim" x="130" y="271" text-anchor="middle">+ residual</text>
    <line class="wire" x1="190" y1="258" x2="308" y2="258" marker-end="url(#m4)"/><text class="small" x="249" y="250" text-anchor="middle">ffn_inp</text><line class="bar" x1="200" y1="246" x2="200" y2="270"/>
    <rect class="box" x="310" y="236" width="120" height="44" rx="6"/><text x="370" y="255" text-anchor="middle">Ffn</text><text class="small dim" x="370" y="271" text-anchor="middle">gate, up, SwiGLU</text>
    <line class="wire" x1="430" y1="258" x2="548" y2="258" marker-end="url(#m4)"/><text class="small" x="489" y="250" text-anchor="middle">ffn_swiglu</text><line class="bar" x1="440" y1="246" x2="440" y2="270"/>
    <rect class="box" x="550" y="236" width="120" height="44" rx="6"/><text x="610" y="255" text-anchor="middle">Down</text><text class="small dim" x="610" y="271" text-anchor="middle">+ residual</text>
    <path class="dash" d="M249 266 V304 H610 V282" marker-end="url(#m4)"/><text class="small dim" x="430" y="318" text-anchor="middle">ffn_inp again, for the residual add</text>
    <line class="wire" x1="670" y1="258" x2="728" y2="258" marker-end="url(#m4)"/><text class="small" x="700" y="250" text-anchor="middle">next x</text><line class="bar" x1="680" y1="246" x2="680" y2="270"/>
  </svg>
