<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 788 350" width="788" height="350" role="img" aria-label="EngineConfig&lt;Model, Gpu&gt; has six members; four are types checked by a concept, n_ctx and threads are derived from the model, and the grid from the GPU type's SM count and blocks per SM.">
  <title>EngineConfig&lt;Model, Gpu&gt; has six members; four are types checked by a concept, n_ctx and threads are derived from the model, and the grid from the GPU type's SM count and blocks per SM.</title>
  <style>
    svg { color: #e5e9ef; }
    text { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e5e9ef; }
    .small { font-size: 10.5px; }
    .dim { fill: #99a4b3; }
    .box { fill: #11151b; stroke: #e5e9ef; stroke-width: 1.2; }
    .ctbox { fill: #12332f; stroke: #35cdb9; stroke-width: 1.4; }
    .rtbox { fill: #3a2415; stroke: #f79456; stroke-width: 1.4; }
    .wire { stroke: #e5e9ef; stroke-width: 1.3; fill: none; }
    .dash { stroke: #99a4b3; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .ctfill { fill: #35cdb9; } .rtfill { fill: #f79456; } .mutefill { fill: #313a48; }
    .cttext { fill: #35cdb9; } .rttext { fill: #f79456; }
    .bar { stroke: #e5e9ef; stroke-width: 3; }
    .card { fill: #1a2029; stroke: #313a48; stroke-width: 1; }
  </style>
  <rect class="card" x="-13.5" y="-13.5" width="787" height="349" rx="8"/>
    <defs><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5e9ef"/></marker></defs>
    <rect class="ctbox" x="10" y="10" width="300" height="262" rx="6"/>
    <text x="24" y="32" font-weight="500">EngineConfig&lt;Model, Gpu&gt;</text>
    <text x="24" y="60">Model     = BuildModel</text>
    <text class="dim" x="24" y="84">  (MK_MODEL: Qwen3, from the GGUF)</text>
    <text x="24" y="108">Kv        = KvBF16</text>
    <text x="24" y="132">n_ctx     = min(4096, context_length)</text>
    <text x="24" y="156">Gpu       = BuildGpu</text>
    <text class="dim" x="24" y="180">  (MK_GPU, default: the GPU found)</text>
    <text x="24" y="204">threads   = group * head_dim</text>
    <text class="dim" x="24" y="228">  (2 * 128 = 256 for Qwen3-0.6B)</text>
    <text x="24" y="252">RowKernel = RowDot8</text>
    <line class="wire" x1="310" y1="56" x2="448" y2="56" marker-end="url(#m3)"/><text class="small" x="379" y="48" text-anchor="middle">must satisfy</text>
    <rect class="box" x="450" y="38" width="300" height="36" rx="6"/><text x="462" y="61">ModelSpec: shape, heads, tensors</text>
    <line class="wire" x1="310" y1="104" x2="448" y2="104" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="86" width="300" height="36" rx="6"/><text x="462" y="109">KvFormat: Bits, store, load</text>
    <line class="wire" x1="310" y1="152" x2="448" y2="152" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="134" width="300" height="36" rx="6"/><text x="462" y="157">GpuSpec: sms, cuda_arch, memory</text>
    <line class="wire" x1="310" y1="248" x2="448" y2="248" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="230" width="300" height="36" rx="6"/><text x="462" y="253">RowKernel: step, dot&lt;Cols&gt;</text>
    <path class="wire" d="M160 272 V298 H238" marker-end="url(#m3)"/><text class="small" x="168" y="292">derives</text>
    <text x="246" y="302">Grid: 66 SMs x 2 per SM = 132 blocks, 1,056 warps</text>
  </svg>
