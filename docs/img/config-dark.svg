<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -14 788 278" width="788" height="278" role="img" aria-label="EngineConfig has six members; three are types checked by a concept, and the grid is derived from the GPU's SM count.">
  <title>EngineConfig has six members; three are types checked by a concept, and the grid is derived from the GPU's SM count.</title>
  <style>
    svg { color: #e5e9ef; }
    text { font-family: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 12px; fill: #e5e9ef; }
    .small { font-size: 10.5px; }
    .dim { fill: #99a4b3; }
    .box { fill: #11151b; stroke: #e5e9ef; stroke-width: 1.2; }
    .ctbox { fill: #12332f; stroke: #35cdb9; stroke-width: 1.4; }
    .rtbox { fill: #3a2415; stroke: #f79456; stroke-width: 1.4; }
    .wire { stroke: #e5e9ef; stroke-width: 1.3; fill: none; }
    .dash { stroke: #99a4b3; stroke-width: 1.2; fill: none; stroke-dasharray: 4 4; }
    .ctfill { fill: #35cdb9; } .rtfill { fill: #f79456; } .mutefill { fill: #313a48; }
    .cttext { fill: #35cdb9; } .rttext { fill: #f79456; }
    .bar { stroke: #e5e9ef; stroke-width: 3; }
    .card { fill: #1a2029; stroke: #313a48; stroke-width: 1; }
  </style>
  <rect class="card" x="-13.5" y="-13.5" width="787" height="277" rx="8"/>
    <defs><marker id="m3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#e5e9ef"/></marker></defs>
    <rect class="ctbox" x="10" y="10" width="300" height="190" rx="6"/>
    <text x="24" y="32" font-weight="500">EngineConfig</text>
    <text x="24" y="60">Kv            = KvBF16</text>
    <text x="24" y="84">n_ctx         = 4096</text>
    <text x="24" y="108">Gpu           = Rtx4070TiSuper</text>
    <text x="24" y="132">blocks_per_sm = 2</text>
    <text x="24" y="156">threads       = 256</text>
    <text x="24" y="180">RowKernel     = RowDot8</text>
    <line class="wire" x1="310" y1="56" x2="448" y2="56" marker-end="url(#m3)"/><text class="small" x="379" y="48" text-anchor="middle">must satisfy</text>
    <rect class="box" x="450" y="38" width="300" height="36" rx="6"/><text x="462" y="61">KvFormat: Bits, store, load</text>
    <line class="wire" x1="310" y1="104" x2="448" y2="104" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="86" width="300" height="36" rx="6"/><text x="462" y="109">GpuSpec: sms, name</text>
    <line class="wire" x1="310" y1="176" x2="448" y2="176" marker-end="url(#m3)"/>
    <rect class="box" x="450" y="158" width="300" height="36" rx="6"/><text x="462" y="181">RowKernel: step, dot&lt;Cols&gt;</text>
    <path class="wire" d="M160 200 V226 H238" marker-end="url(#m3)"/><text class="small" x="168" y="220">derives</text>
    <text x="246" y="230">Grid: 66 SMs x 2 = 132 blocks, 1,056 warps</text>
  </svg>
